#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]
    args.iface="eth0"
    args.user_reuse_authorized_keys='package_checker'
    args.authorized_keys='ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOJWUhO\\+waiB\\+aKvXO0xC5XTL6P/X/TIzQ4hgdXkDfmAfntOj/HXRIu4GulCvJgUoyTiF5Qt9j9gK6Z17szUv3s= package_checker3@domain.tld'
    preinstall = """
    set -x
    sudo mkdir /home/package_checker/.ssh
    sudo chmod 700 /home/package_checker/.ssh
    sudo echo -e "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBFLd58LM9XSgktng1nRUaM4HLUsRNNaMimQ06ZhZhs/ package_checker1@domain.tld\nssh-rsa  package_checker2@domain.tld" > /home/package_checker/.ssh/authorized_keys
    sudo chmod 600 /home/package_checker/.ssh/authorized_keys

    echo "✅ End of preinstall"
    """

